# Builds the Windows installer whenever the version in src-tauri/tauri.conf.json changes and attaches it to a
# draft release. Then the installer is signed with the update key (kept off GitHub), latest.json (with the
# signature) is committed to main, and the release is published. Installed copies read latest.json from main
# at every start and update themselves.
name: release
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["src-tauri/tauri.conf.json"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - run: npm install
      - run: npm run prepare-web
        env: { PLYRA_WEBSITE: website }
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Plyra Chess __VERSION__
          releaseBody: Improvements and fixes.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
