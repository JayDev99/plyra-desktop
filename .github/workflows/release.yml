# Builds the Windows installer whenever the version in src-tauri/tauri.conf.json changes, and attaches it to a
# draft release. The installer is then signed with the update key (kept off GitHub), latest.json is added, and
# the release is published: installed copies update themselves from it at their next start.
name: release
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["src-tauri/tauri.conf.json"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - run: npm install
      - run: npm run prepare-web
        env: { PLYRA_WEBSITE: website }
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Plyra Chess __VERSION__
          releaseBody: Improvements and fixes.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
